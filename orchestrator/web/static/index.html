<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orchestrator</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%234f6bed'/%3E%3Cpath d='M9 11h14M9 16h9M9 21h12' stroke='white' stroke-width='2.6' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"
        integrity="sha384-tStR1zLfWgsiXCF3IgfB3lBa8KmBe/lG287CL9WCeKgQYcp1bjb4/+mwN6oti4Co" crossorigin="anonymous">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-jobs" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></symbol>
    <symbol id="i-phone" viewBox="0 0 24 24"><rect x="6" y="2.5" width="12" height="19" rx="2.5"/><path d="M10 18h4"/></symbol>
    <symbol id="i-activity" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 24 24"><path d="m5 8 4 4-4 4M12 16h7"/></symbol>
  </svg>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Orchestrator</span>
      </div>
      <label class="project-switch">
        <span class="label">Project</span>
        <select id="project-select" aria-label="Project"></select>
      </label>
      <a class="btn primary new-job-btn" href="#/new"><svg class="icon"><use href="#i-plus"/></svg>New job</a>
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/" data-route="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span></a>
        <a href="#/jobs" data-route="jobs"><svg class="icon"><use href="#i-jobs"/></svg><span>Jobs</span></a>
        <a href="#/new" data-route="new" class="nav-new" aria-label="New job"><span class="fab"><svg class="icon"><use href="#i-plus"/></svg></span><span>New</span></a>
        <a href="#/devlogs" data-route="devlogs"><svg class="icon"><use href="#i-phone"/></svg><span>Device logs</span></a>
        <a href="#/activity" data-route="activity"><svg class="icon"><use href="#i-activity"/></svg><span>Activity</span><span class="badge" id="running-badge" hidden></span></a>
      </nav>
      <nav class="nav nav-secondary" aria-label="Tools">
        <span class="label">Tools</span>
        <a href="#/tests" data-route="tests"><span>Tests</span></a>
        <a href="#/git" data-route="git"><span>Git</span></a>
      </nav>
      <button class="btn ghost console-btn" data-action="console"><svg class="icon"><use href="#i-terminal"/></svg>Open full console</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <h1 id="page-title">Home</h1>
          <p class="sub" id="page-sub"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <div id="view" class="view" aria-live="polite"></div>
    </main>
  </div>

  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <h2 id="dialog-title"></h2>
      <div id="dialog-body" class="stack"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" formnovalidate>Cancel</button>
        <button value="ok" class="btn primary" id="dialog-ok">Run</button>
      </div>
    </form>
  </dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
          integrity="sha384-J4qzUjBl1FxyLsl/kQPQIOeINsmp17OHYXDOMpMxlKX53ZfYsL+aWHpgArvOuof9" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
          integrity="sha384-XGqKrV8Jrukp1NITJbOEHwg01tNkuXr6uB6YEj69ebpYU3v7FvoGgEg23C1Gcehk" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
