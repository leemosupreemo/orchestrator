<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orchestrator</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css"

</head>
<body>

  <div class="app">
    <header class="mobile-header">
      <div class="mobile-header-start"><button type="button" class="nav-toggle" id="nav-toggle" aria-label="Open navigation" aria-haspopup="dialog" aria-expanded="false" aria-controls="sidebar"><svg class="icon" aria-hidden="true"><use href="#i-menu"/></svg></button><span class="brand-mark" role="img" aria-label="Orchestrator"></span></div>
      <span class="mobile-title" id="mobile-title"></span>
      <span class="mobile-header-end" aria-hidden="true"></span>
    </header>
    <div class="sidebar-backdrop" id="sidebar-backdrop" hidden aria-hidden="true"></div>
    <aside class="sidebar" id="sidebar" aria-label="Navigation">
      <div class="brand">
        <span class="brand-mark" role="img" aria-label="Orchestrator"></span>
        <button type="button" class="nav-close" id="nav-close" aria-label="Close navigation">✕</button>
      </div>
      <label class="project-switch">
        <span class="label">Project</span>
        <select id="project-select" aria-label="Project"></select>
      </label>
      <button type="button" class="btn search-btn" id="search-btn" aria-haspopup="dialog"><span>Search Orchestrator</span><kbd>⌘K</kbd></button>
      <!-- What people open most sits at the top; settings they touch once are one place, under Settings. -->
      <nav class="nav" id="nav" aria-label="Main">
        <a href="#/readiness" data-route="readiness" id="nav-readiness" hidden><svg class="icon"><use href="#i-check"/></svg><span>Finish setup</span><span class="badge" id="setup-badge"></span></a>
        <a href="#/" data-route="home"><svg class="icon"><use href="#i-home"/></svg><span>Home</span><span class="badge" id="inbox-badge" hidden></span></a>
        <a href="#/activity" data-route="activity"><svg class="icon"><use href="#i-activity"/></svg><span>Activity</span><span class="badge" id="running-badge" hidden></span></a>
        <a href="#/product" data-route="product"><svg class="icon"><use href="#i-doc"/></svg><span>Product</span></a>
      </nav>
      <nav class="nav nav-secondary" aria-label="Tools">
        <span class="label">Build &amp; ship</span>
        <a href="#/tests" data-route="tests"><span>Tests</span></a>
        <a href="#/delivery" data-route="delivery"><span>Delivery</span></a>
        <a href="#/git" data-route="git"><span>Git</span></a>
        <a href="#/devlogs" data-route="devlogs"><span>Device logs</span></a>
        <span class="label">Review</span>
        <a href="#/checkup" data-route="checkup"><span>Check-up</span></a>
        <a href="#/ux-review" data-route="ux-review"><span>UX review</span></a>
        <a href="#/measure" data-route="measure"><span>Measure</span></a>
        <a href="#/docs" data-route="docs"><span>Docs</span></a>
        <span class="label">Settings</span>
        <div class="nav-item-row configuration-nav-item">
          <button type="button" class="configuration-menu-trigger" id="configuration-menu-trigger" data-route="config"
                  aria-haspopup="menu" aria-controls="configuration-context-menu" aria-expanded="false">
            <span>Configuration</span><span aria-hidden="true">▾</span>
          </button>
          <div class="configuration-context-menu" id="configuration-context-menu" role="menu" hidden></div>
        </div>
      </nav>
      <!-- Occasional actions: quiet rows at the foot, not buttons competing with the navigation. -->
      <div class="sidebar-footer">
        <a class="btn ghost help-btn" href="#/help" data-route="help">Help</a>
        <button class="btn ghost console-btn" data-action="console" data-owner-only><svg class="icon" aria-hidden="true"><use href="#i-terminal"/></svg>Open full console</button>
        <button class="btn ghost" id="notify-btn" hidden></button>
        <button class="btn ghost lock-btn" id="lock-btn"><svg class="icon" aria-hidden="true"><use href="#i-lock"/></svg>Lock session</button>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-text">
          <div class="topbar-title-row">
            <a class="back-link" id="back-link" href="#/" aria-label="Back" title="Back" hidden><svg class="icon" aria-hidden="true"><use href="#i-chevron"/></svg></a>
            <h1 id="page-title" tabindex="-1">Home</h1>
          </div>
          <p class="sub" id="page-sub"></p>
        </div>
        <div class="topbar-actions" id="topbar-actions"></div>
      </header>
      <div id="view" class="view" tabindex="-1"></div>
    </main>
    <button class="setup-fab" id="setup-fab" hidden aria-label="Setup checklist"><svg class="icon"><use href="#i-activity"/></svg><span>Setup</span></button>
    <aside class="setup-panel" id="setup-panel" hidden aria-label="Setup checklist"></aside>
    <!-- Phones: the top destinations stay one tap away; the drawer holds everything else. -->
    <nav class="tabbar" id="tabbar" aria-label="Quick">
      <a href="#/" data-route="home"><svg class="icon" aria-hidden="true"><use href="#i-home"/></svg><span>Home</span><span class="badge" data-badge="inbox" hidden></span></a>
      <a href="#/product" data-route="product"><svg class="icon" aria-hidden="true"><use href="#i-doc"/></svg><span>Product</span></a>
      <a href="#/new" data-route="new" class="tabbar-new"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg><span>New job</span></a>
      <a href="#/activity" data-route="activity"><svg class="icon" aria-hidden="true"><use href="#i-activity"/></svg><span>Activity</span><span class="badge" data-badge="running" hidden></span></a>
      <a href="#/tests" data-route="tests"><svg class="icon" aria-hidden="true"><use href="#i-check"/></svg><span>Tests</span></a>
    </nav>
  </div>

  <div class="palette-backdrop" id="palette-backdrop" hidden></div>
  <div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Search and jump" hidden>
    <input id="palette-input" type="text" role="combobox" aria-expanded="true" aria-controls="palette-list" aria-autocomplete="list" aria-label="Search pages, jobs, features and actions" placeholder="Jump to a page, job or feature, or run an action…" autocomplete="off" spellcheck="false">
    <ul id="palette-list" role="listbox" aria-label="Results"></ul>
    <div class="palette-foot muted">↑↓ to move · Enter to open · Esc to close</div>
  </div>


  <dialog id="dialog">
    <form method="dialog" id="dialog-form">
      <div class="dialog-header">
        <h2 id="dialog-title"></h2>
        <button type="button" class="dialog-close-btn" id="dialog-close" aria-label="Close dialog">✕</button>
      </div>
      <div id="dialog-body" class="stack"></div>
      <div class="dialog-actions">
        <button value="cancel" class="btn ghost" id="dialog-cancel" formnovalidate>Cancel</button>
        <button value="ok" class="btn primary" id="dialog-ok">Run</button>
      </div>
    </form>
  </dialog>
  <div id="messages" class="messages" popover="manual" role="region" aria-label="Messages" hidden></div>

  <script src="html.js"></script>
  <script src="project-picker.js"></script>
  <script src="navigation.js"></script>
  <script src="routes.js"></script>
  <script src="configuration.js"></script>
  <script src="feature-plan.js"></script>
  <script src="notifications.js"></script>
  <script src="markdown.js"></script>
  <script src="palette.js"></script>
  <script src="errors.js"></script>
  <script src="messages.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"
          integrity="sha384-J4qzUjBl1FxyLsl/kQPQIOeINsmp17OHYXDOMpMxlKX53ZfYsL+aWHpgArvOuof9" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"
          integrity="sha384-XGqKrV8Jrukp1NITJbOEHwg01tNkuXr6uB6YEj69ebpYU3v7FvoGgEg23C1Gcehk" crossorigin="anonymous"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-messaging-compat.js"></script>
  <script src="account.js"></script>
  <script src="setup.js"></script>
  <script src="app.js"></script>
</body>
</html>
