<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#4f6bed">
  <title>Reset your password</title>
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .reset-page .signin-wrap { padding-top: var(--space-8); }
    .reset-page h1 { margin: 0; font-size: var(--text-xl); }
    .reset-page h1:focus { outline: none; } /* focus moves to the heading so a screen reader announces each step; no ring needed */
    .reset-page .signin-brand img { border-radius: var(--r-sm); }
    .reset-status { margin: 0; min-height: 1.5em; }
    .reset-status.bad, .reset-error { color: var(--bad); }
    .reset-page .btn { text-align: center; justify-content: center; }
  </style>
</head>
<body class="reset-page">
  <main class="signin-wrap">
    <div class="signin-card" id="reset-card">
      <noscript><p>Resetting a password needs JavaScript.</p></noscript>
    </div>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="reset-password.js"></script>
</body>
</html>
